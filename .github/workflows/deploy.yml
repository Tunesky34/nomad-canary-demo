name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on the self-hosted runner installed on the lab VM, because
# GitHub-hosted runners cannot reach the lab registry, Nomad or Consul.
env:
  REGISTRY: localhost:5000
  IMAGE_NAME: demo
  # Never :latest. A new SHA is what makes Nomad see a diff and start a deployment.
  IMAGE_TAG: ${{ github.sha }}

# Least privilege: none of these jobs needs to write to the repository.
permissions:
  contents: read

# One deploy at a time: two overlapping rollouts would fight over the same job.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, lab]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: App unit tests
        working-directory: app
        run: node --test
      - name: Deploy-script tests (fake nomad)
        run: ./tests/test-deploy.sh

  build-and-push:
    needs: test
    runs-on: [self-hosted, lab]
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute image reference
        id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build \
            --build-arg APP_VERSION="${IMAGE_TAG::7}" \
            -t "$IMAGE" \
            app

      - name: Push image to lab registry
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push "$IMAGE"

      - name: Verify image is in the registry
        run: curl -fsS "http://${REGISTRY}/v2/${IMAGE_NAME}/tags/list" | grep -q "${IMAGE_TAG}"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, lab]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # deploy.env holds the demo's failure switches (FAIL_HEALTH etc). Committing
      # FAIL_HEALTH=true to main is how the bad deploy is demonstrated.
      - name: Load deploy settings
        run: cat deploy.env >> "$GITHUB_ENV"

      # Blocks until the Nomad deployment finishes. Exit 1 (failed rollout) turns this
      # job red even when auto_revert already restored the old version.
      - name: Deploy to Nomad and wait for the rollout
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          NOMAD_ADDR: http://127.0.0.1:4646
        run: ./scripts/deploy.sh
